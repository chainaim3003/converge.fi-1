# WF3: Privacy Reserve Check Workflow
#
# Privacy track.
# Trigger: HTTP (confidential)
# Action: Uses Confidential HTTP to call risk-engine → API credentials protected

name: "converge-privacy-reserve-check"
description: "Confidential reserve health check with protected API credentials"

trigger:
  type: http
  config:
    method: POST
    path: "/privacy-check"

actions:
  # Step 1: Confidential HTTP call to risk-engine
  # API credentials are protected by CRE confidential compute
  - name: "fetch-risk-report-confidential"
    type: httpClient.sendRequest
    config:
      method: POST
      url: "${RISK_ENGINE_URL}/api/v1/cre-report"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer ${API_SECRET}"
      body:
        simulationId: "StableCoin-BackingRatio-RedemptionPressure-30d"
        scenarioId: "sc_depeg_stress_scn01"
      confidential: true  # CRE Confidential HTTP — credentials not exposed
    output: riskReport

  # Step 2: Process metrics
  - name: "process-metrics"
    type: runtime.compute
    config:
      code: |
        const report = inputs.riskReport.report;
        return {
          backingRatioBps: report.backingRatioBps,
          liquidityRatioBps: report.liquidityRatioBps,
          riskScore: report.riskScore,
          maturityGapDays: report.maturityGapDays,
          timestamp: report.timestamp,
          scenarioId: report.scenarioId
        };
    inputs:
      riskReport: "${fetch-risk-report-confidential.output}"
    output: metrics

  # Step 3: Sign and write on-chain
  - name: "sign-report"
    type: runtime.report
    config:
      encoding: "abi"
      types:
        - { name: "backingRatioBps", type: "uint16" }
        - { name: "liquidityRatioBps", type: "uint16" }
        - { name: "riskScore", type: "uint8" }
        - { name: "maturityGapDays", type: "uint8" }
        - { name: "timestamp", type: "uint40" }
        - { name: "scenarioId", type: "bytes32" }
    inputs:
      backingRatioBps: "${process-metrics.output.backingRatioBps}"
      liquidityRatioBps: "${process-metrics.output.liquidityRatioBps}"
      riskScore: "${process-metrics.output.riskScore}"
      maturityGapDays: "${process-metrics.output.maturityGapDays}"
      timestamp: "${process-metrics.output.timestamp}"
      scenarioId: "${process-metrics.output.scenarioId}"
    output: signedReport

  - name: "write-on-chain"
    type: evmClient.writeReport
    config:
      chain: "ethereum-sepolia"
      contractAddress: "${RISK_CONSUMER_ADDRESS}"
      method: "onReport"
    inputs:
      report: "${sign-report.output}"

env:
  RISK_ENGINE_URL: "http://localhost:3001"
  RISK_CONSUMER_ADDRESS: ""
  API_SECRET: ""  # Protected by CRE confidential compute
