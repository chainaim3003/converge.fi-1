# WF3: Privacy Reserve Check — Vault DON Secrets Declaration
#
# This file declares the secret names that the workflow retrieves at runtime
# via nodeRuntime.getSecret({ id: "<name>" }).result().value
#
# For local simulation (cre simulate):
#   Secrets are provided via environment variables listed under each secret name.
#   Set these in the .env file in this directory.
#
# For deployed workflows (cre deploy):
#   Upload secrets to the Vault DON using:
#     cre secrets create secrets.yaml --target production-settings
#   Or with 1Password CLI:
#     op run --env-file .env -- cre secrets create secrets.yaml --target production-settings
#
# Secrets are namespaced per workflow ID — other workflows cannot access them.
# At runtime, each DON node provides a decryption share after remote attestation
# of the TEE enclave. The enclave recombines shares, uses the credentials, and
# discards them after execution.
#
# Official docs:
#   https://docs.chain.link/cre/guides/workflow/secrets/using-secrets-deployed
#   https://docs.chain.link/cre/guides/workflow/secrets/using-secrets-simulation-go
#   https://docs.chain.link/cre/guides/workflow/secrets/managing-secrets-1password

secretsNames:
  # URL of the Converge.fi risk-engine Express server
  # Used in: confidentialHttpClient.sendRequest({ url: ... })
  # Example: http://localhost:3001 (dev) or https://risk.converge.fi (prod)
  RISK_ENGINE_URL:
    - RISK_ENGINE_URL_ENV

  # API authentication token for the risk-engine
  # Used in: Authorization: Bearer <token> header
  # This protects the risk-engine from unauthorized access
  API_SECRET:
    - API_SECRET_ENV
